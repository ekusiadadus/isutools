# Apache httpd LogFormat. OpenLiteSpeed supports Apache-compatible access-log
# format strings; configure this string in its virtual-host Access Log panel.
LogFormat "{\"schema\":\"isutools.http-access.v1\",\"method\":\"%m\",\"uri\":\"%U\",\"protocol\":\"%H\",\"status\":%>s,\"duration_us\":%D,\"bytes\":%B,\"sess\":\"%{X-Isutools-Session}o\",\"scenario\":\"%{X-Isutools-Scenario}o\"}" isutools_json
CustomLog /var/log/apache2/isutools-access.jsonl isutools_json

# Never use %{X-Isutools-Session}i: the i form is a public request header.
Header always unset X-Isutools-Session
Header always unset X-Isutools-Scenario
