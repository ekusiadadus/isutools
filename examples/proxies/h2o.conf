# H2O access-log mapping. %{duration}x is seconds; %<...o reads the response
# header received from upstream instead of a public request header.
access-log:
  path: /var/log/h2o/isutools-access.jsonl
  format: '{"schema":"isutools.http-access.v1","method":"%m","uri":"%U","protocol":"%H","status":%s,"duration_sec":%{duration}x,"bytes":%b,"sess":"%<{X-Isutools-Session}o","scenario":"%<{X-Isutools-Scenario}o"}'
  escape: json
