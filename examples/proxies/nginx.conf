# http {} fragment; OpenResty uses the same nginx log module.
log_format isutools escape=json
  'method:$request_method\turi:$uri\tstatus:$status\treqtime:$request_time'
  '\tupstime:$upstream_response_time\tbytes:$body_bytes_sent'
  '\tcache:$upstream_cache_status\tctype:$sent_http_content_type'
  '\tproto:$server_protocol\tsess:$upstream_http_x_isutools_session'
  '\tscenario:$upstream_http_x_isutools_scenario';
access_log /var/log/nginx/isutools-access.log isutools;

# Do not expose application-only labels to the public client.
proxy_hide_header X-Isutools-Session;
proxy_hide_header X-Isutools-Scenario;
