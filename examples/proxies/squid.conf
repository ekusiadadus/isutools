# Squid logformat fragment. %>rm method, %>ru URL, %>Hs status, %<st bytes,
# %tr response time in milliseconds. %rp is Squid's request URL path
# (excluding the hostname); isutools also strips any query during decode.
logformat isutools_json {"schema":"isutools.http-access.v1","method":"%>rm","uri":"%rp","protocol":"HTTP/1.1","status":%>Hs,"duration_ms":%tr,"bytes":%<st}
access_log stdio:/var/log/squid/isutools-access.jsonl isutools_json
