# stream {} fragment for the L4 organizer proxy used by ISUCON6 final.
# This is connection evidence and must not be parsed as an HTTP request.
log_format isutools_stream escape=json
  '{"schema":"isutools.l4-connection.v1","protocol":"$protocol",'
  '"status":"$status","duration_sec":$session_time,'
  '"bytes_in":$bytes_received,"bytes_out":$bytes_sent,'
  '"upstream_connect_sec":"$upstream_connect_time"}';
access_log /var/log/nginx/isutools-stream.jsonl isutools_stream;
