server.modules += ( "mod_accesslog" )
accesslog.filename = "/var/log/lighttpd/isutools-access.jsonl"
# %D is microseconds. %U is the URL path without the query string.
accesslog.format = "{\"schema\":\"isutools.http-access.v1\",\"method\":\"%m\",\"uri\":\"%U\",\"protocol\":\"%H\",\"status\":%s,\"duration_us\":%D,\"bytes\":%b}"
