# Include inside nginx's http {} block, then add
# `access_log /var/log/nginx/isutools.log isutools;` to the measured server.
log_format isutools escape=json
  'method:$request_method'
  '\turi:$uri'
  '\tstatus:$status'
  '\treqtime:$request_time'
  '\tupstime:$upstream_response_time'
  '\tbytes:$body_bytes_sent'
  '\tcache:$upstream_cache_status'
  '\tctype:$sent_http_content_type';

