# Include inside nginx's http {} block, then add
# `access_log /var/log/nginx/isutools.log isutools;` to the measured server.
# X-Isutools-Session must be a short pseudonymous ID produced by the trusted
# app-side sessionlabel adapter. Never map a raw Cookie or authorization token.
# X-Isutools-Scenario is a non-secret label such as login_and_browse, produced
# by the same trusted app-side adapter. Inbound labels are spoofable, so clear
# both public and internal forms before proxying. Log only upstream responses
# and do not expose those response headers to the public client.
# nginx stops inheriting parent proxy_set_header directives when a child
# location declares any proxy_set_header of its own. In that case repeat these
# four clearing directives inside that proxying location as defense in depth.
proxy_set_header X-Isutools-Session "";
proxy_set_header X-Isutools-Scenario "";
proxy_set_header X-Isutools-Trusted-Session "";
proxy_set_header X-Isutools-Trusted-Scenario "";
proxy_hide_header X-Isutools-Session;
proxy_hide_header X-Isutools-Scenario;
log_format isutools escape=json
  'method:$request_method'
  '\turi:$uri'
  '\tstatus:$status'
  '\treqtime:$request_time'
  '\tupstime:$upstream_response_time'
  '\tbytes:$body_bytes_sent'
  '\tcache:$upstream_cache_status'
  '\tctype:$sent_http_content_type'
  '\tproto:$server_protocol'
  '\tsess:$upstream_http_x_isutools_session'
  '\tscenario:$upstream_http_x_isutools_scenario';
