# Loaded from nginx's http {} through /etc/nginx/conf.d/*.conf.
# The file is pre-created as www-data:isucon 0640 so nginx can write it and
# the isupipe-go service can read it without exposing other nginx logs.
log_format isutools escape=json
  'method:$request_method'
  '\turi:$uri'
  '\tstatus:$status'
  '\treqtime:$request_time'
  '\tupstime:$upstream_response_time'
  '\tbytes:$body_bytes_sent'
  '\tcache:$upstream_cache_status'
  '\tctype:$sent_http_content_type'
  '\tproto:$server_protocol'
  '\tsess:$upstream_http_x_isutools_session'
  '\tscenario:$http_x_isutools_scenario';

access_log /home/isucon/isutools-data/nginx-access.log isutools;
