# Loaded from nginx's http {} through /etc/nginx/conf.d/*.conf.
# The file is pre-created as www-data:isucon 0640 so nginx can write it and
# the isupipe-go service can read it without exposing other nginx logs.
# Public labels are spoofable. Clear them before proxying, accept no internal
# trusted-label forwarding in this production-shaped example, and hide the
# app-generated pseudonyms from clients.
# The app middleware also strips all four inbound labels. If a proxying
# location declares its own proxy_set_header, nginx does not inherit these
# parent-scope clearing directives; repeat them in that location if the app
# itself consumes similarly named headers.
proxy_set_header X-Isutools-Session "";
proxy_set_header X-Isutools-Scenario "";
proxy_set_header X-Isutools-Trusted-Session "";
proxy_set_header X-Isutools-Trusted-Scenario "";
proxy_hide_header X-Isutools-Session;
proxy_hide_header X-Isutools-Scenario;

log_format isutools escape=json
  'method:$request_method'
  '\turi:$uri'
  '\tstatus:$status'
  '\treqtime:$request_time'
  '\tupstime:$upstream_response_time'
  '\tbytes:$body_bytes_sent'
  '\tcache:$upstream_cache_status'
  '\tctype:$sent_http_content_type'
  '\tproto:$server_protocol'
  '\tsess:$upstream_http_x_isutools_session'
  '\tscenario:$upstream_http_x_isutools_scenario';

access_log /home/isucon/isutools-data/nginx-access.log isutools;
