name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-1-24-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go test ./...
        working-directory: adapters/echov4
      - run: go test ./...
        working-directory: adapters/gin
      - run: go test ./...
        working-directory: adapters/chiv5
      - name: Historical ISUCON framework adapters (Go 1.24)
        run: |
          for module in echov3 gorillamux httprouter gojiv2 martini; do
            (cd "adapters/$module" && go test ./...)
          done

  linux-cgroup-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hard-limit bootstrap and OOM recovery (Go 1.24)
        run: >-
          docker run --rm --privileged --cgroupns=host
          --mount type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup
          --mount type=bind,src="$GITHUB_WORKSPACE",dst=/src
          -w /src -e GOTOOLCHAIN=local golang:1.24-bookworm
          sh integration/test-linux-cgroup.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: vet
        run: go vet ./...
      - name: build all operator CLIs
        run: make build-tools
      - name: test (race)
        run: go test -race -coverprofile=cover.out ./...
      - name: Echo v5 adapter
        working-directory: adapters/echov5
        run: go test -race ./...
      - name: Echo v4 adapter
        working-directory: adapters/echov4
        run: go test -race ./...
      - name: Gin adapter
        working-directory: adapters/gin
        run: go test -race ./...
      - name: chi v5 adapter
        working-directory: adapters/chiv5
        run: go test -race ./...
      - name: Echo v3 adapter
        working-directory: adapters/echov3
        run: go test -race ./...
      - name: Gorilla mux adapter
        working-directory: adapters/gorillamux
        run: go test -race ./...
      - name: httprouter adapter
        working-directory: adapters/httprouter
        run: go test -race ./...
      - name: Goji v2 adapter
        working-directory: adapters/gojiv2
        run: go test -race ./...
      - name: Martini adapter
        working-directory: adapters/martini
        run: go test -race ./...
      - name: coverage gate (80%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 80) }'
      - name: ABBA script contract
        run: |
          bash -n examples/abba.sh examples/abba_test.sh \
            examples/isucon13-wsl/flow-abba-restart.sh
          python3 -m py_compile examples/isucon13-wsl/flow-abba-bench.py
          bash examples/abba_test.sh
      - name: Makefile saved-snapshot selection
        run: |
          output=$(make verify-results RESULTS_DIR=integration/testdata/results)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | sed '1d' | jq -e '
            .time == "2026-08-14T01:01:01+09:00" and
            .generation == 9 and
            .score == "123" and
            .run_id == "run-fixture-snapshot" and
            .validity == "valid"
          '
          if make verify-results RESULTS_DIR=integration/testdata/no-snapshots; then
            echo "verify-results accepted a directory without a saved snapshot" >&2
            exit 1
          fi
      # Informational only: shared runners are too noisy for a hard latency
      # gate. The real overhead gate is the on/off benchmark comparison on
      # the target host before tagging a release (DESIGN.md §7).
      - name: benchmarks (informational)
        run: go test -run '^$' -bench . -benchmem ./internal/agg/ ./internal/accessinspect/
      - name: parser fuzz smoke
        run: |
          go test ./internal/accessinspect -run '^$' -fuzz '^FuzzInspectBounded$' -fuzztime=3s
          go test ./internal/slowlog -run '^$' -fuzz '^FuzzParseBounded$' -fuzztime=3s
          go test ./internal/analysisartifact -run '^$' -fuzz '^FuzzInspectAndDecodeBounded$' -fuzztime=3s

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: sqlrows self-contamination
        env:
          ISUTOOLS_INTEGRATION_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/?parseTime=true
        run: go test -tags=integration -count=1 ./sqlrows -run '^TestNoSelfContamination$'
      - name: ISUCON14 trajectory export SQL
        env:
          ISUTOOLS_INTEGRATION_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/?parseTime=true
        run: go test -tags=integration -count=1 ./integration/trajectorysql -run '^TestISUCON14TrajectoryExportExecutesOnMySQL8$'
      - name: MySQL 8.4 real slow-log parser
        run: bash integration/test-mysql-slowlog.sh

  sql-compat-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: isutools
          POSTGRES_PASSWORD: isutools
          POSTGRES_DB: isutools
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U isutools -d isutools"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: PostgreSQL and SQLite database/sql instrumentation
        working-directory: integration/sqlcompat
        env:
          ISUTOOLS_INTEGRATION_POSTGRES_DSN: postgres://isutools:isutools@127.0.0.1:5432/isutools?sslmode=disable
        run: go test -count=1 ./...

  proxy-config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native validation for published ISUCON proxy families
        run: bash integration/test-proxy-configs.sh
