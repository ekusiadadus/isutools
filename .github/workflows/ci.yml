name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-1-24-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage gate (80%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 80) }'
      - name: ABBA script contract
        run: |
          bash -n examples/abba.sh examples/abba_test.sh
          bash examples/abba_test.sh
      # Informational only: shared runners are too noisy for a hard latency
      # gate. The real overhead gate is the on/off benchmark comparison on
      # the target host before tagging a release (DESIGN.md §7).
      - name: benchmarks (informational)
        run: go test -run '^$' -bench . -benchmem ./internal/agg/

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: sqlrows self-contamination
        env:
          ISUTOOLS_INTEGRATION_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/?parseTime=true
        run: go test -tags=integration -count=1 ./sqlrows -run '^TestNoSelfContamination'
