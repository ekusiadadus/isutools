server {
  listen 80 default_server backlog=4096;
  server_name _;
  root /var/www/html;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server backlog=4096;
  server_name _;
  root /var/www/html;

  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name xiv.isucon.net *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  access_log /var/log/nginx/isutools.log isutools buffer=256k flush=1s;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    gzip off;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isuride_go;
  }

  location /api/internal/ {
    gzip off;
    allow 127.0.0.1;
    deny all;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isuride_go;
  }
}
